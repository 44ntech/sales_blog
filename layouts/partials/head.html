<meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/images/site-logo.svg">
<meta name="theme-color" content="#111827">
{{ partial "meta" . }}

<link href="/images/site-logo.svg" rel="preload" as="image" fetchpriority="high">

<style>
  [x-cloak] {
    display: none !important;
  }
</style>

<script>
  if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
</script>

{{ $mainCSS := "" }}
{{ if fileExists "static/css" }}
  {{ range readDir "static/css" }}
    {{ if and (strings.Contains .Name "main.") (strings.HasSuffix .Name ".css") }}{{ $mainCSS = .Name }}{{ end }}
  {{ end }}
{{ end }}
{{ if $mainCSS }}
  <link rel="stylesheet" href="/css/{{ $mainCSS }}">
{{ end }}
<link rel="stylesheet" href="/css/site.css">
