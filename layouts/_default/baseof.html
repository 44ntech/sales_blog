<!doctype html>
<html lang="{{ site.LanguageCode }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.Params.description }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    {{ $styles := resources.Get "css/site.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
      <nav aria-label="Primary">
        <a href="{{ site.Home.RelPermalink }}#available">Available</a>
        <a href="{{ site.Home.RelPermalink }}#contact">Contact</a>
      </nav>
    </header>

    <main>
      {{ block "main" . }}{{ end }}
    </main>

    <footer class="site-footer">
      <span>{{ site.Params.location }}</span>
      <span>Updated {{ now.Format "Jan 2, 2006" }}</span>
    </footer>
  </body>
</html>
