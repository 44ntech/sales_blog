services:
  edge:
    image: nginx:1.27-alpine
    depends_on:
      - web1
      - web2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro

  web1:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      args:
        HUGO_BASEURL: http://localhost:8080/
    expose:
      - "80"

  web2:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      args:
        HUGO_BASEURL: http://localhost:8080/
    expose:
      - "80"
